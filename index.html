<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="//unpkg.com/alpinejs" defer></script>
    <title>Calculator</title>
    <style type="text/tailwindcss">
        @theme {
            --color-clifford: #da373d;
        }
    </style>
</head>

<body>
    <main x-data="{ open: false}" class="flex min-h-screen flex-col md:flex-row">
        <nav class="navbar">
            <div class="flex h-screen flex-col justify-between border-e border-gray-100 bg-white">
                <div class="p-4">
                    <span class="grid h-12 w-32 place-content-center rounded-lg bg-gray-100 text-sm text-gray-500">
                        Logo
                    </span>

                    <ul class="mt-4 space-y-1">
                        <li>
                            <a href="#" x-on:click="open = false" class="block rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-900">
                                General
                            </a>
                        </li>
                        <li>
                            <a href="#" x-on:click="open = true" class="block rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-900">
                                Calculator
                            </a>
                        </li>
                        
                    </ul>
                </div>
            </div>
        </nav>
        <section class="p-4 md:p-6 lg:p-8 flex flex-col justify-center items-center w-full">
            <div x-show="!open" class="h-screen w-full m-auto">
                <h1 class="text-2xl font-bold text-center">Welcome to the Calculator</h1>
                <p class="text-center">This is a simple calculator application.</p>
            </div>
            <div x-show="open" class="mt-4">
                <h1 class="text-2xl font-bold text-center">Calculator</h1>
                <div class="mx-auto w-[400px] grid grid-cols-4 grid-rows-5 gap-2 p-4">
                    <div class="col-span-4 bg-gray-200 p-4 text-right" id="display">0</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4" id="btn-clear">C</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4" id="btn-plus-minus">±</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4" id="btn-percent">%</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4 btn-operator" id="btn-divide">÷</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4 btn-number" id="btn-7">7</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4 btn-number" id="btn-8">8</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4 btn-number" id="btn-9">9</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4 btn-operator" id="btn-multiply">×</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4 btn-number" id="btn-4">4</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4 btn-number" id="btn-5">5</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4 btn-number" id="btn-6">6</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4 btn-operator" id="btn-subtract">-</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4 btn-number" id="btn-1">1</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4 btn-number" id="btn-2">2</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4 btn-number" id="btn-3">3</div>
                    <div class="bg-gray-300 hover:bg-gray-400 p-4 btn-operator" id="btn-add">+ </div>
                    <div class="col-span-2 bg-gray-300 hover:bg-gray-400 p-4 btn-number" id="btn-0">0</div>
                    <div class="col-span-2 bg-gray-300 hover:bg-gray-500 hover:text-white p-4" id="btn-equals"> = </div>
                </div>
                <script src="main.js" defer></script>
            </div>
        </section>
    </main>
</body>

</html>
