<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Calculator</title>
    <style type="text/tailwindcss">
        @theme {
            --color-clifford: #da373d;
        }
    </style>
</head>
<body>
    <div class="max-w-md mx-auto grid grid-cols-4 grid-rows-5 gap-2 p-4">
        <div class="col-span-4 bg-gray-200 p-4 text-right">0</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">C</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">±</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">%</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">÷</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">7</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">8</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">9</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">×</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">4</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">5</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">6</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">-</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">1</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">2</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">3</div>
        <div class="bg-gray-300 hover:bg-gray-400 p-4">+ </div>
        <div class = "col-span-2 bg-gray-300 hover:bg-gray-500 hover:text-white p-4"> = </div>
    </div>
</body>
</html>
